name: Pull request

# Lint and unit tests on every pull request, forks' included. The whole suite
# stays in ci.yml, on main. Read-only and without secrets: a fork's code runs
# here, so this is never pull_request_target.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pull-request-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  # Kept in step with .github/workflows/ci.yml's env block.
  PHP_VERSION: '8.5'
  NODE_VERSION: 26

jobs:
  javascript:
    name: JavaScript lint and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:ts

  php:
    name: PHP lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: vendor/bin/php-cs-fixer fix --dry-run --diff
      - run: vendor/bin/phpcs
      - run: vendor/bin/phpunit --testsuite unit
