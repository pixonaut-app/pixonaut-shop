name: Release

# Started by hand (Actions tab, or `gh workflow run Release`). release-please
# opens or updates a release pull request from the Conventional Commits on
# main, which needs the repository to allow GitHub Actions to create pull
# requests. Dispatched after that pull request is merged, it tags the version
# and creates the GitHub release; the build job then builds, smoke-tests and
# attaches the zip and its SHA-256 checksum, in two flavors: the GitHub one,
# `pixonaut-shop-X.Y.Z.zip`, which stores update to through the theme's
# updater, and the wordpress.org one, `pixonaut-shop-X.Y.Z-wporg.zip`, without
# the updater, for uploading to the theme directory. The updater downloads only
# the first name, so attaching the second offers stores nothing. Stores are
# offered a release only once its GitHub zip is attached.
#
# With `build_ref` it skips release-please and builds that ref as an artifact,
# publishing nothing.
on:
  workflow_dispatch:
    inputs:
      build_ref:
        description: 'Ref to build as an artifact, publishing nothing (optional)'
        required: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  # Kept in step with .github/workflows/ci.yml's env block.
  PHP_VERSION: '8.5'
  NODE_VERSION: 26
  THEME_SLUG: pixonaut-shop

jobs:
  release-please:
    if: inputs.build_ref == ''
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    needs: release-please
    if: >-
      always() && (inputs.build_ref != '' ||
      needs.release-please.outputs.release_created == 'true')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # scripts/release/flavor.ts says what each flavor ships.
        flavor: [github, wporg]
    env:
      FLAVOR: ${{ matrix.flavor }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name || inputs.build_ref }}

      - name: Resolve the version
        id: version
        env:
          # Through the environment, never interpolated into the script:
          # build_ref is free text on a dispatch, in a job that can write.
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          if [ -n "$RELEASE_TAG" ]; then
            TAG="$RELEASE_TAG"
          else
            # No release: build an inspectable artifact without claiming a
            # real version.
            TAG="dev-$(git rev-parse --short HEAD)"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      # A store is offered the version style.css holds at the tag, not the
      # tag's name, so the two must agree before anything is published.
      - name: The tag names the version in style.css
        if: needs.release-please.outputs.release_created == 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/release/check-tag-cli.ts "$TAG"

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none
          tools: composer:v2

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # The wordpress.org flavor ships no vendor/: its only runtime package is
      # the update checker it leaves out.
      - name: Install runtime dependencies only
        if: matrix.flavor == 'github'
        run: |
          composer install --no-dev --no-interaction --no-progress \
            --prefer-dist --optimize-autoloader --classmap-authoritative

      - name: Compile the translation catalogue
        run: |
          sudo apt-get update && sudo apt-get install -y gettext
          msgfmt -o languages/sv_SE.mo languages/sv_SE.po

      # An allowlist: only what WordPress loads at runtime, and for the
      # wordpress.org flavor the sources build/ is made from. Anything not
      # named (tests/, docs/, node_modules/, tooling configs) is left out by
      # construction, development files are stripped from vendor/, and the
      # staged theme is checked for what its flavor must and must not hold.
      - name: Assemble the theme
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/release/flavor-cli.ts assemble --flavor "$FLAVOR" stage

      # The zip's top directory is the theme's slug, which a store stores its
      # Styles under; the update checker installs it as it is.
      - name: Create the zip
        id: zip
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          ZIP=$(node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/release/flavor-cli.ts zip-name --flavor "$FLAVOR" "$VERSION")
          cd stage
          zip -rq "../${ZIP}" "$THEME_SLUG"
          cd ..
          sha256sum "$ZIP" > "${ZIP}.sha256"
          echo "name=${ZIP}" >> "$GITHUB_OUTPUT"

      - name: Smoke-test the zip on a fresh WordPress with WooCommerce
        env:
          ZIP: ${{ steps.zip.outputs.name }}
          SMOKE_DIR: smoke
          # Off .wp-env.json's ports, so running this step by hand beside a
          # local wp-env never collides with it.
          SMOKE_PORT: 8855
          SMOKE_TESTS_PORT: 8856
        run: |
          # The zip itself, not the checkout: a file the allowlist forgot
          # fails here instead of on a store. Core and PHP are read from
          # .wp-env.json so this site runs what CI's suites run. The
          # checkout's after-start script writes the .htaccess the shop's
          # address needs when this runs by hand under rootless Docker; on the
          # runner it does nothing.
          CORE=$(jq -r .core .wp-env.json)
          PHP=$(jq -r .phpVersion .wp-env.json)
          WP_ENV="$GITHUB_WORKSPACE/node_modules/.bin/wp-env"
          mkdir -p "$SMOKE_DIR"
          unzip -q "$ZIP" -d "$SMOKE_DIR"
          node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/release/flavor-cli.ts check --flavor "$FLAVOR" "$SMOKE_DIR/$THEME_SLUG"
          cat > "$SMOKE_DIR/.wp-env.json" <<JSON
          {
            "core": "$CORE",
            "phpVersion": "$PHP",
            "plugins": ["https://downloads.wordpress.org/plugin/woocommerce.zip"],
            "themes": ["./$THEME_SLUG"],
            "port": $SMOKE_PORT,
            "testsPort": $SMOKE_TESTS_PORT,
            "lifecycleScripts": { "afterStart": "$GITHUB_WORKSPACE/scripts/docker/wp-env-after-start.sh" },
            "config": { "WP_DEBUG": true, "WP_DEBUG_LOG": true, "WP_DEBUG_DISPLAY": false }
          }
          JSON
          cd "$SMOKE_DIR"
          "$WP_ENV" start
          "$WP_ENV" run cli wp theme activate "$THEME_SLUG"
          "$WP_ENV" run cli wp option update woocommerce_coming_soon no
          # The front page and the shop, which renders the archive template.
          for path in / /shop/; do
            status=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:${SMOKE_PORT}${path}")
            echo "${path} ${status}"
            [ "$status" = 200 ] || exit 1
          done
          # Without WooCommerce the theme still renders pages and posts.
          "$WP_ENV" run cli wp plugin deactivate woocommerce
          status=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:${SMOKE_PORT}/")
          echo "/ without WooCommerce ${status}"
          [ "$status" = 200 ] || exit 1
          "$WP_ENV" run cli sh -c \
            '! grep -E "PHP (Fatal error|Parse error|Warning)" wp-content/debug.log 2>/dev/null'

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.THEME_SLUG }}-${{ steps.version.outputs.version }}-${{ matrix.flavor }}
          path: ${{ steps.zip.outputs.name }}*
          if-no-files-found: error
          retention-days: 30

      # The update checker offers only a release with the GitHub flavor's zip
      # attached, so a release appears to stores the moment that zip is
      # uploaded, not before. The wordpress.org zip's name never matches the
      # updater's asset pattern (GitHubUpdater::ASSET_PATTERN).
      - name: Attach the zip and its checksum
        if: needs.release-please.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          ZIP: ${{ steps.zip.outputs.name }}
        run: |
          gh release upload "$TAG" "$ZIP" "$ZIP.sha256" --clobber
